# Every check of this configuration, on every push and pull request.
#
# - check-all: hooks/check-all (parens, lint, every test) on the oldest
#   supported Emacs and the current releases.  The same script runs by
#   hand after `git am'; see hooks/HOOKS-README.md.
# - secrets: Gitleaks over the whole history, all branches.
# - shell: ShellCheck over the shell scripts.
#
# Actions are pinned to the commit of a release (the tag in the comment),
# so that a changed tag cannot change what runs here; Gitleaks is checked
# against the SHA-256 its release publishes.  A red result means a check
# failed; a green one that none of them found anything -- not that the
# code is right.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-all:
    name: check-all (Emacs ${{ matrix.emacs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 29.1: the oldest release of Emacs 29, the oldest this
        # configuration supports (README, Requirements).
        emacs: ['29.1', '30.2', '31.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs }}

      # Packages change on MELPA daily; a new set once a week is enough
      # for tests that need two of them.
      - name: Week of the year, for the package cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.emacs.d/elpa
          key: elpa-${{ matrix.emacs }}-${{ hashFiles('tests/ci-packages.el') }}-${{ steps.week.outputs.week }}

      # Hunspell with a Polish and an English dictionary: the spelling
      # test checks that the installed ones are found (test-spelling-languages).
      # pandoc and PyYAML: the Obsidian import's script converts with
      # them (test-obsidian-import).
      - name: Hunspell and its dictionaries, pandoc and PyYAML
        run: sudo apt-get install -y hunspell hunspell-pl hunspell-en-gb pandoc python3-yaml

      - name: Install the packages the tests load
        run: |
          mkdir -p ~/.emacs.d/elpa
          emacs -Q --batch -l tests/ci-packages.el

      - name: Checks and tests
        # Every package the tests need is installed here, so a skipped
        # test is a failure (hooks/check-all).
        env:
          MYPKS_STRICT_TESTS: '1'
        run: bash hooks/check-all

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the whole history, not only the last commit

      - name: Gitleaks 8.30.1
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --log-opts="--all" --redact --verbose .

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck hooks/pre-commit hooks/check-all hooks/check-weekly
