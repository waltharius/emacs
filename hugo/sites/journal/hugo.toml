# Generated from ~/.emacs.d/hugo/sites/journal/hugo.toml by modules/46-blog.el.
# Edit that file, not this one: the next sync replaces this copy.
# Laptop-only site: `hugo server' listens on 127.0.0.1.

baseURL = 'http://localhost:1314/'
languageCode = 'pl-PL'
defaultContentLanguage = 'pl'
title = 'Notatki'
theme = 'PaperMod'

# JSON index of the home page feeds PaperMod's search page (/search/).
# It holds the text of every page: for the whole journal, several MB
# loaded by the browser when the search page opens.
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params]
  mainSections = ['journal']
  homeSections = ['journal', 'posts']
  latestPerSection = 1
  ShowReadingTime = true
  ShowToc = true
  TocOpen = false
  backlinksTitle = 'Linkują tutaj'

[params.assets]
  favicon = 'favicon.svg'
  favicon16x16 = 'favicon.svg'
  favicon32x32 = 'favicon.svg'
  apple_touch_icon = 'favicon.svg'

[[menu.main]]
  name = 'Dziennik'
  url = '/journal/'
  weight = 10
[[menu.main]]
  name = 'Blog'
  url = '/posts/'
  weight = 20
[[menu.main]]
  name = 'Dokumentacja'
  url = 'http://localhost:1315/'
  weight = 30
[[menu.main]]
  name = 'Tagi'
  url = '/tags/'
  weight = 40
[[menu.main]]
  name = 'Szukaj'
  url = '/search/'
  weight = 50
