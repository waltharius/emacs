# Generated from ~/.emacs.d/hugo/sites/docs/hugo.toml by modules/46-blog.el.
# Edit that file, not this one: the next sync replaces this copy.
# Theme Geekdoc (https://github.com/thegeeklab/hugo-geekdoc), installed
# from its release bundle by modules/46-blog.el; needs Hugo 0.160 or
# newer.  Values follow Geekdoc's documented configuration.

baseURL = 'http://localhost:1315/'
locale = 'pl-PL'
defaultContentLanguage = 'pl'
title = 'Dokumentacja'
theme = 'hugo-geekdoc'
pluralizeListTitles = false
disablePathToLower = true

[markup.goldmark.renderer]
  # Geekdoc needs raw HTML for nested shortcodes.
  unsafe = true

[markup.tableOfContents]
  # ox-hugo writes Org's top headings as ##; the page title is the #.
  startLevel = 2
  endLevel = 4

[params]
  # Left menu: the folder tree of content/, here the docs section.
  geekdocCollapseAllSections = false
  # One section only: the trail would read 'Dokumentacja / Dokumentacja'.
  geekdocBreadcrumb = false
  # Full-text search over the site, built into the theme.
  geekdocSearch = true
  geekdocToC = 4
  # Table of contents above the text and backlinks under it come from
  # hugo/theme/hugo-geekdoc/layouts/_default/single.html.
  backlinksTitle = 'Linkują tutaj'
